# Publica GeoReyno en GitHub Pages creando config.js a partir de los secretos del repositorio,
# para que el token de Mapillary (y Supabase) funcione para todos sin subirlo al código.
#
# Para que funcione (una sola vez):
#   1. Settings → Secrets and variables → Actions → New repository secret:
#        MAPILLARY_TOKEN     tu token de Mapillary (MLY|...)
#        SUPABASE_URL        la «Project URL» de Supabase (cuando actives las cuentas)
#        SUPABASE_ANON_KEY   la clave «anon public» de Supabase (cuando actives las cuentas)
#   2. Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Después, cada push a main publica la web sola (pestaña Actions para ver el progreso).
# Un token de cliente siempre es visible en el navegador del jugador: Mapillary los da para eso (solo lectura).

name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Crear config.js desde el secreto
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Quita espacios y saltos de línea que se cuelan al pegar los secretos, y las comillas.
          limpio() { printf '%s' "$1" | tr -d '\r\n"' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          {
            printf 'export const MAPILLARY_TOKEN = "%s";\n' "$(limpio "$MAPILLARY_TOKEN")"
            printf 'export const SUPABASE_URL = "%s";\n' "$(limpio "$SUPABASE_URL" | sed 's#/rest/v1/*$##; s#/*$##')"
            printf 'export const SUPABASE_ANON_KEY = "%s";\n' "$(limpio "$SUPABASE_ANON_KEY")"
          } > config.js
          # Comprobación: config.js debe tener exactamente 3 líneas válidas.
          test "$(wc -l < config.js)" -eq 3 && node --check --input-type=module < config.js
      - uses: actions/configure-pages@v5
      - name: Quitar lo que no hace falta publicar
        run: rm -rf .git .github tools/*.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
