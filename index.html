<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoReyno · Juegos de Navarra</title>
  <meta name="description" content="Juegos diarios de geografía e historia de Navarra: quiz del día, pueblos, escudos y más.">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#b3122e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GeoReyno">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="GeoReyno · Juegos de Navarra">
  <meta property="og:description" content="Juegos diarios de geografía e historia de Navarra: quiz del día, pueblos, escudos y más.">
  <meta property="og:url" content="https://javierlarrea99.github.io/GeoReyno/">
  <meta property="og:image" content="https://javierlarrea99.github.io/GeoReyno/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="top" data-layout></header>

  <main class="wrap">
    <section class="hero">
      <h1>¿Cuánto conoces Navarra?</h1>
      <p>Un reto nuevo cada día, el mismo para todo el mundo. Juega, compara con tus amigos y no rompas la racha.</p>
    </section>

    <section class="modes" id="modes" aria-label="Modos de juego"></section>
  </main>

  <footer class="foot" data-layout></footer>

  <script type="module" src="js/layout.js"></script>
  <script type="module">
    import { MODES, EXTRA_PAGES, getTodayResult, resultLabel, esc } from "./js/engine.js";
    const friends = EXTRA_PAGES.find((p) => p.id === "amigos");
    const cards = MODES.filter((m) => !m.sub).map((m) => {
      if (m.ready === false) {
        return `<div class="mode disabled" aria-disabled="true">
          <span class="tag soon">Próximamente</span>
          <h2>${esc(m.name)}</h2><p>${esc(m.desc)}</p></div>`;
      }
      const done = getTodayResult(m.id);
      return `<a class="mode" href="${esc(m.href)}">
        <span class="tag live">Diario</span>
        <h2>${esc(m.name)}</h2><p>${esc(m.desc)}</p>
        <span class="status">${done ? `Hoy: ${esc(resultLabel(done))} ✓` : ""}</span></a>`;
    });
    cards.push(friends.ready === false
      ? `<div class="mode disabled" aria-disabled="true"><span class="tag soon">Próximamente</span>
          <h2>Jugar con amigos</h2><p>Crea una sala, comparte el código y jugad el mismo reto a la vez.</p></div>`
      : `<a class="mode" href="${esc(friends.href)}"><span class="tag friends">En grupo</span>
          <h2>Jugar con amigos</h2><p>Crea una sala, comparte el código y jugad el mismo reto a la vez.</p></a>`);
    document.getElementById("modes").innerHTML = cards.join("");
  </script>
</body>
</html>
